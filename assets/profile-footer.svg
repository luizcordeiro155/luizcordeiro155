<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="210" viewBox="0 0 1400 210" role="img" aria-labelledby="title desc">
  <title id="title">Rodapé visual do perfil de Luiz Cordeiro</title>
  <desc id="desc">Ondas roxas em fundo escuro para finalizar o README do GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#120B22"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B177E" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#160B2D" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1400" height="210" rx="18" fill="url(#bg)"/>
  <ellipse cx="710" cy="152" rx="470" ry="38" fill="#7C3AED" opacity="0.16" filter="url(#glow)"/>

  <path d="M0 67 C195 93 365 106 575 94 C805 81 1010 62 1400 86 L1400 210 L0 210 Z" fill="url(#wave2)"/>
  <path d="M0 113 C210 91 420 111 650 119 C875 127 1100 115 1400 92 L1400 210 L0 210 Z" fill="url(#wave1)"/>
  <path d="M0 154 C260 139 474 146 690 160 C935 176 1160 151 1400 132 L1400 210 L0 210 Z" fill="#0D1117" opacity="0.96"/>

  <g opacity="0.8">
    <circle cx="180" cy="55" r="2.5" fill="#A78BFA"/>
    <circle cx="244" cy="35" r="1.8" fill="#8B5CF6"/>
    <circle cx="1120" cy="45" r="2.2" fill="#C4B5FD"/>
    <circle cx="1215" cy="64" r="1.6" fill="#A855F7"/>
  </g>
</svg>
