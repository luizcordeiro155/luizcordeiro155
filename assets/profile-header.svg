  <text x="700" y="292" text-anchor="middle" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="1">Java • TypeScript • APIs • Web Apps • Automation</text>
</svg>
